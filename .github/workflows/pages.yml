name: Tests y despliegue en GitHub Pages

# Ejecuta las comprobaciones en cambios de main, solicitudes de cambios y manualmente.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Limita los permisos globales y evita cancelar despliegues en curso.
permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  # Valida el HTML y ejecuta los tests con Node.js 22.
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v7
      - name: Configurar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar tests
        run: npm test

  # Publica el contenido de site/ únicamente desde main y fuera de pull requests.
  despliegue:
    needs: tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v7
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6
      - name: Preparar artefacto de Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
